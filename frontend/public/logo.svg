<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lingo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3399ff"/>
    </linearGradient>
    <linearGradient id="lingo-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242b35"/>
      <stop offset="100%" stop-color="#151921"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#lingo-bg)" stroke="#3399ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Dialogue Bubble / Gamepad Body -->
  <path d="M140 130 C200 120 312 120 372 130 C430 140 450 190 440 260 C430 330 390 360 330 365 L260 365 C230 365 210 390 180 415 C175 420 165 416 168 405 L175 365 C120 360 80 330 72 260 C62 190 82 140 140 130 Z"
        fill="#1e293b" fill-opacity="0.8" stroke="url(#lingo-grad)" stroke-width="8" filter="url(#glow)"/>

  <!-- D-Pad (Left) -->
  <g fill="url(#lingo-grad)">
    <rect x="135" y="220" width="18" height="50" rx="5" />
    <rect x="119" y="236" width="50" height="18" rx="5" />
  </g>

  <!-- 4 Action Buttons (Right) -->
  <g fill="url(#lingo-grad)">
    <circle cx="365" cy="225" r="9" />
    <circle cx="385" cy="245" r="9" />
    <circle cx="345" cy="245" r="9" />
    <circle cx="365" cy="265" r="9" />
  </g>

  <!-- Translation Exchange Arrows (Center) -->
  <g stroke="url(#lingo-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Arrow (pointing right) -->
    <path d="M 235 228 L 275 228 M 265 218 L 275 228 L 265 238" />
    <!-- Bottom Arrow (pointing left) -->
    <path d="M 275 262 L 235 262 M 245 252 L 235 262 L 245 272" />
    <!-- Subtle center orbit circle -->
    <circle cx="255" cy="245" r="42" stroke="url(#lingo-grad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  </g>
</svg>
